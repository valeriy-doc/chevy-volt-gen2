name = "volt-chat-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Comma-separated list of sites allowed to call this proxy.
# Add "http://localhost:8000" here while testing locally.
ALLOWED_ORIGINS = "https://valeriy-doc.github.io,https://vstepanovdev.github.io"

# --- Optional: IP rate limiting -------------------------------------------
# Uncomment to cap each visitor to 15 requests/minute. The worker.js code
# already uses this binding if present. (Cloudflare's native rate-limiting
# binding — no KV or extra service needed.)
#
# [[unsafe.bindings]]
# name = "CHAT_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"          # any unique number for your account
# simple = { limit = 15, period = 60 }
